<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>MediCare AI — by Pritam</title>

	<!-- This is the Flask-rendered variant, served at "/" by app.py's own
	     route -- the simplest deployment, where one Flask app serves both
	     the API and this frontend from the same origin (no
	     window.__MEDICARE_API_BASE__ needed; static/app.jsx's API_BASE
	     constant defaults to same-origin when it's unset). For deploying
	     the frontend as its own separate static site instead (e.g.
	     Netlify/Vercel, calling a Render-hosted API cross-origin), see
	     index.html at the repo root and DEPLOYMENT.md. -->

	<!-- Favicon: SVG for modern browsers (scales cleanly, matches the
	     sidebar logo exactly), PNG/ICO fallbacks for everything else. -->
	<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
	<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}" />
	<link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}" />
	<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}" />
	<link rel="alternate icon" href="{{ url_for('static', filename='favicon.ico') }}" />
	<link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}" />

	<!-- Applied before first paint so a saved dark-mode preference doesn't
	     flash light for a moment while React loads (must match THEME_KEY
	     in static/app.jsx). -->
	<script>
		(function () {
			try {
				var theme = localStorage.getItem("medicare_ai_theme") || "light";
				document.documentElement.setAttribute("data-theme", theme);
			} catch (e) {}
		})();
	</script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

	<!-- Tailwind (Play CDN — JIT in the browser, no build step) -->
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					fontFamily: {
						display: ['Fraunces', 'ui-serif', 'Georgia', 'serif'],
						mono: ['"IBM Plex Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
					},
					keyframes: {
						'msg-in': { '0%': { opacity: 0, transform: 'translateY(6px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
						'typing-bounce': { '0%, 60%, 100%': { transform: 'translateY(0)', opacity: 0.5 }, '30%': { transform: 'translateY(-4px)', opacity: 1 } },
						'mic-pulse': { '0%': { boxShadow: '0 0 0 0 rgba(184,56,42,0.35)' }, '70%': { boxShadow: '0 0 0 10px rgba(184,56,42,0)' }, '100%': { boxShadow: '0 0 0 0 rgba(184,56,42,0)' } },
						'voice-wave': { '0%, 100%': { transform: 'scaleY(0.35)' }, '50%': { transform: 'scaleY(1)' } },
					},
					animation: {
						'msg-in': 'msg-in 0.22s ease',
						'typing-bounce': 'typing-bounce 1.1s infinite ease-in-out',
						'mic-pulse': 'mic-pulse 1.2s infinite',
						'voice-wave': 'voice-wave 0.9s ease-in-out infinite',
					},
				},
			},
		};
	</script>

	<link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}" />
</head>
<body>
	<div id="root">
		<!-- Replaced once React mounts. If you're staring at this, something
		     failed before React could even start -- check the browser console. -->
		<noscript>MediCare AI needs JavaScript enabled to run.</noscript>
		<div id="bootLoading" style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#66766F;">
			Loading MediCare AI…
		</div>
	</div>

	<!-- React (production UMD builds) -->
	<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
	<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

	<!-- Markdown rendering for bot messages -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

	<!-- Charts for the Dashboard view (static/app.jsx). UMD build
	     specifically, not the plain ES-module build cdnjs also hosts --
	     the ES-module version does `import` internally and throws "Cannot
	     use import statement outside a module" when loaded as a plain
	     script with no bundler, the exact same failure mode already noted
	     below for Babel's automatic runtime. -->
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>

	<!-- Babel standalone: transforms static/app.jsx in-browser (no build step).
	     Fine for a project this size; a real production app would precompile
	     with Vite/esbuild instead — see README for the trade-off. -->
	<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

	<script>
		// Loads and transforms app.jsx manually via Babel's core transform()
		// API, rather than Babel's "auto-scan the page for <script
		// type='text/babel' src=...>" convenience feature. That auto-scan
		// path goes through an older XHR/onreadystatechange code path that
		// can fail to fully transform an externally-loaded file in some
		// browser/extension setups, throwing "Cannot use import statement
		// outside a module" even though the source file has no imports at
		// all -- the failure is in Babel's script-tag loader, not in
		// app.jsx. Calling Babel.transform() directly avoids that path
		// entirely, and lets real errors get shown on-screen instead of
		// leaving a blank page with no clue why.
		(function () {
			function showBootError(title, detail) {
				var root = document.getElementById("root");
				if (root) {
					root.innerHTML =
						'<div style="max-width:640px;margin:64px auto;padding:24px;font-family:sans-serif;line-height:1.6;color:#333;">' +
						'<h2 style="color:#B8382A;margin-bottom:8px;">' + title + '</h2>' +
						'<p style="margin-bottom:8px;">' + detail + '</p>' +
						'<p style="font-size:13px;color:#888;">Open the browser console (F12 → Console tab) for full details.</p>' +
						"</div>";
				}
				console.error(title + ": " + detail);
			}

			if (!window.React || !window.ReactDOM) {
				showBootError(
					"Couldn't load React",
					"A CDN script (React/ReactDOM from unpkg.com) failed to load. Check your internet connection, or an ad-blocker/privacy extension may be blocking it — try disabling it and refreshing."
				);
				return;
			}
			if (!window.Babel) {
				showBootError(
					"Couldn't load Babel",
					"The Babel CDN script (from unpkg.com) failed to load. Check your internet connection, or an ad-blocker/privacy extension may be blocking it — try disabling it and refreshing."
				);
				return;
			}

			fetch("{{ url_for('static', filename='app.jsx') }}")
				.then(function (res) {
					if (!res.ok) throw new Error("Fetching app.jsx returned HTTP " + res.status);
					return res.text();
				})
				.then(function (source) {
					// runtime: "classic" is explicit on purpose. The "automatic"
					// JSX runtime (the default in newer Babel versions) compiles
					// JSX into code that does `import {jsx as _jsx} from
					// "react/jsx-runtime"` — a real ES module import statement,
					// which fails with "Cannot use import statement outside a
					// module" when injected as a plain script, since there's no
					// bundler here to resolve it. Classic mode compiles to plain
					// React.createElement(...) calls instead, which is what
					// app.jsx (using the global `React` from the CDN script
					// above) expects.
					var transformed = window.Babel.transform(source, {
						presets: [["react", { runtime: "classic" }]],
					}).code;
					var script = document.createElement("script");
					script.textContent = transformed;
					document.body.appendChild(script);
				})
				.catch(function (err) {
					showBootError(
						"Something went wrong loading the app",
						(err && err.message) ? err.message : String(err)
					);
				});
		})();
	</script>
</body>
</html>
